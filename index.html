<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c52e6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diamond Karigar</title>
<style>
:root{--k:1.2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bad:#c0392b;--rad:18px;--sh:none}
[data-design="1"][data-mode="light"]{--bg:#f4f8ff;--card:#fff;--ink:#0f1f45;--mute:#62708f;--line:#dce6fb;--pri:#1747c9;--hd:linear-gradient(135deg,#0a2a8f 0%,#1c52e6 55%,#3a86ff 100%);--hdink:#fff;--acc:#5ac8ff;--ok:#1f8a4c;--btn:linear-gradient(135deg,#1747c9,#2f6bff);--btnink:#fff;--navbg:#fff;--ni:#7a88a6;--no:#1747c9;--tint:#e6eeff;--g1:#fff;--g2:#d6e6ff;--g3:#8ab4ff;--sh:0 4px 16px #1c52e61a}
[data-design="1"][data-mode="dark"]{--bg:#091024;--card:#111b3a;--ink:#e8eeff;--mute:#93a3cc;--line:#22346b;--pri:#7aa7ff;--hd:linear-gradient(135deg,#071a5c,#123aa8 60%,#2563eb);--hdink:#fff;--acc:#5ac8ff;--ok:#4cc882;--btn:linear-gradient(135deg,#2f6bff,#4d8aff);--btnink:#fff;--navbg:#111b3a;--ni:#8fa0c8;--no:#7aa7ff;--tint:#1d2d63;--g1:#fff;--g2:#d6e6ff;--g3:#8ab4ff;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans Gujarati",sans-serif;font-size:calc(16px*var(--k));line-height:1.4;padding-bottom:100px}
header{position:relative;background:var(--hd);color:var(--hdink);padding:16px 14px 40px;display:flex;align-items:center;gap:10px;overflow:hidden}
header::before{content:"";position:absolute;right:-30px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(#ffffff40,transparent 65%)}
header>*:not(.wave){position:relative;z-index:1}
header .gem{width:46px;height:42px;flex:none}
.gem .a{fill:var(--g1)}.gem .b{fill:var(--g2)}.gem .c{fill:var(--g3)}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:calc(22px*var(--k));line-height:1.15}
#ttl{display:block;font-size:calc(16px*var(--k));font-weight:600;opacity:.95}
#ttl::after{content:"";display:block;width:54px;height:2px;border-radius:2px;background:currentColor;opacity:.55;margin-top:4px}
header .ib{width:40px;height:40px;border-radius:50%;border:2px solid currentColor;background:#ffffff1f;color:inherit;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
header .ib svg{width:20px;height:20px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:30px}.wave path{fill:var(--bg)}
.li{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:calc(16px*var(--k))}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:12px;margin-bottom:12px}
label{font-size:calc(13px*var(--k));color:var(--mute);display:block;margin-bottom:4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:minmax(80px,1.3fr) 1fr 1fr calc(78px*var(--k));gap:6px;align-items:center;margin-bottom:8px}
.row b{font-size:calc(14px*var(--k));overflow-wrap:anywhere}
.row .t{text-align:right;font-size:calc(14px*var(--k));font-variant-numeric:tabular-nums}
.head{font-size:calc(12px*var(--k));color:var(--mute)}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font-size:calc(17px*var(--k));font-weight:700}
.btn.sm{width:auto;padding:8px 12px;font-size:calc(14px*var(--k))}
.btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ed{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.off{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.two{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin:4px 0 12px}
.two .hd,.two .vl{display:flex;justify-content:space-between}
.two .hd{font-size:calc(13px*var(--k));color:var(--mute);font-weight:700}
.two .vl{font-size:calc(22px*var(--k));font-weight:700}
.tots{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px;margin:0 0 12px}
.tots div{display:flex;justify-content:space-between;font-size:calc(18px*var(--k));font-weight:700}
.tots div+div{margin-top:4px}
.tots .g{color:var(--ok)}.tots .r{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbg);border-radius:24px 24px 0 0;box-shadow:0 -4px 18px #1b2a6a1f;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:6px 1px 7px;border:0;background:none;color:var(--ni);font:inherit;font-size:calc(11px*(.5 + var(--k)/2));border-radius:16px}
nav button i{display:block;font-style:normal;font-size:calc(19px*var(--k));line-height:1.3}
nav button.on{color:var(--no);font-weight:700;background:var(--tint)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--pri)}
.flex{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mute{color:var(--mute);font-size:calc(13px*var(--k))}
.mo{display:flex;align-items:center;justify-content:space-between;font-weight:700;gap:4px}
.mo button{border:0;background:var(--btn);color:var(--btnink);font-size:calc(22px*var(--k));width:36px;height:36px;border-radius:50%;padding:0;line-height:1;flex:none}
.who{font-size:calc(18px*var(--k));font-weight:700;text-align:center;margin:0 0 10px}
.who small{display:block;font-size:calc(14px*var(--k));font-weight:400;color:var(--mute)}
.po{display:none}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .btn{padding:9px;font-size:calc(15px*var(--k))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:calc(20px*var(--k))}.stat span{font-size:calc(12px*var(--k));color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:calc(10px*var(--k));color:var(--mute)}
.col i{display:block;width:100%;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.col.cur i{background:var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:calc(14px*var(--k));z-index:30}
@media print{header,nav,.noprint{display:none!important}.po{display:block}body{background:#fff;color:#000;padding:0}.card,.tots,.two,.stat{border-color:#999}}
</style>
</head>

 return '<div class="card mo noprint"><button onclick="yv(-1)">&#8249;</button><span>'+tr("yrT")+' '+y+'</span><button onclick="yv(1)">&#8250;</button></div><p class="who po">'+tr("yrT")+' '+y+'</p>'
 +'<div class="seg noprint"><button class="btn sm '+(yk=="r"?"":"off")+'" style="flex:1" onclick="yk=\'r\';vSummary()">&#8377; '+tr("ke")+'</button><button class="btn sm '+(yk=="h"?"":"off")+'" style="flex:1" onclick="yk=\'h\';vSummary()">'+tr("dia")+'</button></div>'
 +'<div class="card"><div class="chart">'+vals.map(function(v){return '<div class="col'+(v.k==cm?" cur":"")+'">'+(v[yk]?short(v[yk]):"")+'<i style="height:'+Math.round(v[yk]/m*150)+'px"></i></div>'}).join("")+'</div>'
 +'<div class="chart" style="height:auto;padding:4px 0 0">'+vals.map(function(v,i){return '<div class="col" style="height:auto">'+(i+1)+'</div>'}).join("")+'</div></div>'
 +blk(hs,rs)+'<div class="tots"><div class="r"><span>'+tr("tU")+'</span><span>- '+money(us)+'</span></div><div class="g"><span>'+tr("bal")+'</span><span>'+money(rs-us)+'</span></div><div><span>'+tr("dw")+'</span><span>'+ws+'</span></div></div>'
 +'<button class="btn noprint" onclick="pdf()">'+tr("pdf")+'</button>'}
function yv(d){mo=(+mo.slice(0,4)+d)+"-"+mo.slice(5);vSummary()}
function pdf(){try{window.print()}catch(e){toast(tr("pdfErr"))}}

/* SETTINGS */
function vSettings(){
 var th=function(k){return '<button class="btn sm '+(S.theme==k?"":"off")+'" style="flex:1" onclick="setTh(\''+k+'\')">'+tr(k)+'</button>'};
 var fz=function(k){return '<button class="btn sm '+(S.fs==k?"":"off")+'" style="flex:1" onclick="setFs(\''+k+'\')">'+tr("fs"+k)+'</button>'};
 var lg=function(k,n){return '<button class="btn sm '+(S.lang==k?"":"off")+'" style="flex:1" onclick="setLg(\''+k+'\')">'+n+'</button>'};
 $("app").innerHTML='<div class="card"><b>'+tr("prof")+'</b><label style="margin-top:8px">'+tr("nm")+'</label><input value="'+esc(S.name)+'" oninput="S.name=this.value;save()"><label style="margin-top:8px">'+tr("firm")+'</label><input value="'+esc(S.firm)+'" oninput="S.firm=this.value;save()"></div>'
 +'<div class="card"><b>'+tr("lang")+'</b><div class="flex" style="margin-top:8px">'+lg("en","English")+lg("hi","हिन्दी")+lg("gu","ગુજરાતી")+'</div></div>'
 +'<div class="card"><b>'+tr("rset")+'</b><p class="mute">'+tr("rhint")+'</p>'
 +S.types.map(function(t,i){return '<div class="row" style="grid-template-columns:1.3fr 1fr"><b>'+esc(t)+'</b><input inputmode="decimal" placeholder="0.00" value="'+(S.rates[t]||"")+'" onchange="setR('+i+',this.value)"></div>'}).join("")+'</div>'
 +'<div class="card"><b>'+tr("types")+'</b><p class="mute">'+tr("thint")+'</p>'
 +S.types.map(function(x,i){return '<div class="flex" style="margin-bottom:8px"><input value="'+esc(x)+'" onchange="renT('+i+',this.value)"><button class="btn sm ghost" onclick="rmT('+i+')">&#10005;</button></div>'}).join("")
 +'<div class="flex"><input id="nt" placeholder="'+tr("newT")+'"><button class="btn sm" onclick="addT()">'+tr("add")+'</button></div></div>'
 +'<div class="card"><b>'+tr("th")+'</b><div class="flex" style="margin-top:8px">'+th("auto")+th("light")+th("dark")+'</div></div>'
 +'<div class="card"><b>'+tr("fs")+'</b><div class="flex" style="margin-top:8px">'+fz("1")+fz("2")+fz("3")+'</div></div>'
 +'<div class="card"><b>'+tr("rem")+'</b><p class="mute">'+tr("remh")+'</p><div class="flex"><span></span><button class="btn sm '+(S.remind.on?"":"off")+'" onclick="togR()">'+(S.remind.on?tr("on"):tr("off"))+'</button></div>'
 +'<label style="margin-top:8px">'+tr("time")+'</label><input type="time" value="'+S.remind.time+'" onchange="S.remind.time=this.value;save();toast(tr(\'tset\'))"><p class="mute" style="margin-top:8px">'+tr("demo")+'</p></div>'
 +'<div class="card" style="padding:2px 14px"><div class="li" onclick="shareApp()"><span>📤</span>'+tr("shA")+'</div><div class="li" onclick="soon()"><span>⬆️</span>'+tr("upA")+'</div><div class="li" onclick="soon()" style="border:0"><span>⭐</span>'+tr("raA")+'</div></div><p class="mute" style="text-align:center">V1.0 (demo)</p>'}
function shareApp(){var u=location.href,x=tr("shMsg");try{if(navigator.share){navigator.share({title:"Diamond Karigar",text:x,url:u});return}}catch(e){}try{navigator.clipboard.writeText(x+" "+u).then(function(){toast(tr("copied"))},function(){toast(u)})}catch(e){toast(u)}}
function soon(){toast(tr("soon"))}
function setLg(k){S.lang=k;save();render()}
function setTh(k){S.theme=k;theme();save();vSettings()}
function setFs(k){S.fs=k;theme();save();vSettings()}
function togR(){S.remind.on=!S.remind.on;save();if(S.remind.on){try{Notification.requestPermission()}catch(e){}}vSettings()}
setInterval(function(){if(!S.remind.on)return;var d=new Date(),hm=pad(d.getHours())+":"+pad(d.getMinutes()),k=today()+hm;
 if(hm==S.remind.time&&fired!=k){fired=k;try{if(Notification.permission=="granted")new Notification("Diamond Karigar",{body:tr("remNow")});else toast(tr("remNow"))}catch(e){toast(tr("remNow"))}}},20000);
function setR(i,v){var t=S.types[i];if(v==="")delete S.rates[t];else S.rates[t]=v;draft={};save();toast(tr("rtoast"))}
function addT(){var v=$("nt").value.trim();if(v&&S.types.indexOf(v)<0){S.types.push(v);draft={};save();vSettings()}}
function rmT(i){ask(tr("cdT"),function(){S.types.splice(i,1);draft={};save();vSettings()})}
function renT(i,v){v=v.trim();var o=S.types[i];if(!v||v==o){vSettings();return}
 if(S.types.indexOf(v)>=0){toast(tr("exists"));vSettings();return}
 S.types[i]=v;if(S.rates[o]!==undefined){S.rates[v]=S.rates[o];delete S.rates[o]}
 S.entries.forEach(function(e){e.rows.forEach(function(r){if(r.type==o)r.type=v})});draft={};save();vSettings()}
try{localStorage.removeItem("hb_login")}catch(e){}
render();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
